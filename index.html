function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}}
function normalizeLoadedState(saved){
  const base=newState(saved?.name,saved?.gender,saved?.diff||"normal");
  S=Object.assign(base,saved||{});
  S.portfolio=S.portfolio&&typeof S.portfolio==="object"?S.portfolio:{};
  S.stockCost=S.stockCost&&typeof S.stockCost==="object"?S.stockCost:{};
  S.companies=S.companies&&typeof S.companies==="object"?S.companies:{};
  S.team=Array.isArray(S.team)?S.team:[];
  S.inventory=Array.isArray(S.inventory)?S.inventory:[];
  S.achievements=Array.isArray(S.achievements)?S.achievements:[];
  S.titles=Array.isArray(S.titles)&&S.titles.length?S.titles:["初出茅庐"];
  S.chats=S.chats&&typeof S.chats==="object"?S.chats:{};
  S.social=Array.isArray(S.social)?S.social:[];
  S.log=Array.isArray(S.log)?S.log:[];
  S.flags=S.flags&&typeof S.flags==="object"?S.flags:{};
  S.settings=Object.assign({callSec:10,smsSec:5,notify:true,doNotDisturb:false},S.settings||{});
  if(!BANK_CARDS.find(c=>c.id===S.flags.bankCard))S.flags.bankCard="black";
  // 兼容旧存档：旧版本若已有持仓但没有成本记录，则以载入时价格建立成本基准，避免出现 NaN。
  STOCKS.forEach(st=>{
    const held=Number(S.portfolio[st.id]||0);
    if(held>0 && (!Number.isFinite(Number(S.stockCost[st.id])) || Number(S.stockCost[st.id])<=0)){
      S.stockCost[st.id]=+(held*st.price).toFixed(2);
    }
    if(held<=0){
      delete S.portfolio[st.id];
      delete S.stockCost[st.id];
    }
  });
  save();
  return S;
}

function currentDay(){return Math.floor((Date.now()-S.startTime)/DAY_MS)+1;}
function fmtRealTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function fmtRealDate(){const d=new Date();const wd=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];return `${d.getMonth()+1}月${d.getDate()}日 · ${wd} · 第${currentDay()}天`;}
function settleDays(){
  const d=currentDay();
  if(d>S.lastSettledDay){
    const days=d-S.lastSettledDay;
    const inc=passiveIncome(), sal=S.team.reduce((a,t)=>a+t.salary,0);
    S.cash+=(inc-sal)*days;
    let repB=0,fameB=0;S.team.forEach(t=>{if(t.boost==="rep")repB+=t.amt;if(t.boost==="fame")fameB+=t.amt;});
    S.reputation+=Math.round(repB/3*days);S.fame+=Math.round(fameB/3*days);
    S.lastSettledDay=d;
    checkTitle();checkAchievements();save();
    toast(`📅 过去 ${days} 天累计入账<br><small class='pos'>+${money((inc-sal)*days)}</small>`,3600);
  }
}

function netWorth(){
  let n=S.cash;
  for(const id in S.portfolio){const st=STOCKS.find(x=>x.id===id);if(st)n+=st.price*S.portfolio[id];}
  ACQUIRE.forEach(c=>{if(S.companies[c.id])n+=c.price;});
  SHOP.forEach(it=>{if(S.inventory.includes(it.id))n+=it.price*0.5;});
  return n;
}
function passiveIncome(){
  let inc=S.dailyIncome;
  ACQUIRE.forEach(c=>{if(S.companies[c.id])inc+=c.income;});
  let mult=1;S.team.forEach(t=>{if(t.boost==="income")mult+=t.amt;});
  return Math.round(inc*mult);
}

function toast(msg,ms=2600){
  const t=document.createElement("div");t.className="toast";t.innerHTML=msg;
  $("#toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity=0;t.style.transition="opacity .4s";setTimeout(()=>t.remove(),400);},ms);
}
function logEvent(txt){S.log.unshift({d:currentDay(),txt});if(S.log.length>60)S.log.pop();}

function delta(obj){
  let parts=[];
  for(const k in obj){
    const v=obj[k];
    if(k==="cash"){S.cash+=v;parts.push((v>=0?"+":"")+money(v));}
    else if(k in S){
      if(["mood","energy","health"].includes(k))S[k]=clamp(S[k]+v,0,100);
      else S[k]=Math.max(0,S[k]+v);
      const label={mood:"心情",energy:"精力",health:"健康",reputation:"声望",fame:"名气"}[k]||k;
      if(v)parts.push(label+(v>=0?" +":" ")+v);
    }
  }
  checkTitle();checkAchievements();refreshHUD();save();
  return parts.join("  ");
}

function checkTitle(){
  const nw=netWorth();let best=TITLES[0].t;
  TITLES.forEach(x=>{if(nw>=x.nw)best=x.t;});
  if(!S.titles.includes(best)){S.titles.push(best);S.activeTitle=best;toast("🎖️ 解锁新称号：<b>"+best+"</b>");}
}
function unlock(id){
  if(S.achievements.includes(id))return;
  const a=ACHS.find(x=>x.id===id);if(!a)return;
  S.achievements.push(id);toast("🏆 成就达成：<b>"+a.name+"</b>");logEvent("解锁成就「"+a.name+"」");
}
function checkAchievements(){
  const nw=netWorth();
  if(nw>=1e6)unlock("millionaire");
  if(nw>=1e9)unlock("billionaire");
  if(nw>=1e12)unlock("richest");
  if(S.team.length>=5)unlock("team5");
  if(Object.values(S.companies).some(Boolean))unlock("first_company");
}

function randomEvent(manual=false){
  if(!S||busy())return false;
  let candidates=RANDOM_EVENTS.map((d,i)=>({d,i})).filter(x=>!recentRandomEvents.includes(x.i));
  if(!candidates.length){recentRandomEvents=[];candidates=RANDOM_EVENTS.map((d,i)=>({d,i}));}
  const pickOne=pick(candidates); const d=pickOne.d; recentRandomEvents.push(pickOne.i); if(recentRandomEvents.length>8)recentRandomEvents.shift();
  openModal({title:"🎲 "+(manual?"随机事件":"突发事件"),body:d.q,choices:d.a.map(o=>({label:o.t,onClick:()=>{const r=delta(o.e);logEvent("随机事件 → "+o.t);toast(o.m+(r?"<br><small>"+r+"</small>":""),3200);closeModal();renderBiz();}}))});
  return true;
}
function scheduleRandomEvents(){
  clearTimeout(eventTimer);
  if(!S||!S.settings)return;
  const sec=Number(S.settings.randomEventSec);
  if(!Number.isFinite(sec)||sec<=0)return;
  eventTimer=setTimeout(()=>{randomEvent();scheduleRandomEvents();},clamp(sec*1000,1000,3600000));
}

function doDecision(){
  if(S.energy<10)return;
  S.energy=clamp(S.energy-10,0,100);
  const d=pick(DECISIONS);
  openModal({title:"💡 商业决策",body:d.q,
    choices:d.a.map(opt=>({label:opt.t,onClick:()=>{
      const r=delta(opt.e);S.decisionsMade++;unlock("first_deal");
      logEvent("决策 → "+opt.t);closeModal();
      setTimeout(()=>toast(opt.m+(r?"<br><small>"+r+"</small>":"")),200);renderBiz();
    }}))});
}

function renderStocks(){
  const body=$("#marketBody");
  const summary=stockPortfolioSummary();
  body.innerHTML=`<div class="muted" style="margin:0 2px 10px">股价每5秒波动，买入会扣除现金，卖出会回款；持仓成本会用于计算真实已实现/未实现盈亏。⚠️迷因狗币风险极高。</div>
   <div class="card">
     <div class="row"><span class="muted">持仓成本</span><b>${money(summary.invested)}</b></div>
     <div class="row"><span class="muted">当前市值</span><b>${money(summary.value)}</b></div>
     <div class="row"><span class="muted">浮动盈亏</span><b class="${summary.profit>=0?'pos':'neg'}">${summary.profit>=0?"+":""}${money(summary.profit)}</b></div>
   </div>`+
   STOCKS.map(st=>{
    const held=S.portfolio[st.id]||0;
    const basis=S.stockCost[st.id]||0;
    const avg=held?basis/held:0;
    const pnl=held*st.price-basis;
    const dir=st._last?(st.price>=st._last?"price-up":"price-down"):"";
    const arrow=st._last?(st.price>=st._last?"▲":"▼"):"";
    return `<div class="list-item" style="cursor:default">
      <div class="avatar">${st.emoji}</div>
      <div class="li-main"><div class="n">${st.name} <span class="tag">${st.id}</span></div>
        <div class="s">持有 ${held} 股 · 市值 ${money(held*st.price)}</div>
        ${held?`<div class="s">成本 ${money(basis)} · 均价 ${money(avg)} · <span class="${pnl>=0?'pos':'neg'}">${pnl>=0?"+":""}${money(pnl)}</span></div>`:"<div class='s'>暂无持仓</div>"}</div>
      <div style="text-align:right">
        <div class="${dir}" style="font-weight:700">$${st.price.toFixed(2)} ${arrow}</div>
        <div style="margin-top:5px;display:flex;gap:4px">
          <button class="btn sm green" data-buy="${st.id}" ${S.cash<st.price?"disabled":""}>买</button>
          <button class="btn sm red" data-sell="${st.id}" ${held?"":"disabled"}>卖</button>
        </div></div></div>`;
  }).join("");
  $$("[data-buy]",body).forEach(b=>b.onclick=()=>tradeModal(b.dataset.buy,"buy"));
  $$("[data-sell]",body).forEach(b=>b.onclick=()=>tradeModal(b.dataset.sell,"sell"));
}
function tradeModal(id,side){
  const st=STOCKS.find(x=>x.id===id);
  const held=S.portfolio[id]||0;
  const costBasis=S.stockCost[id]||0;
  const avgCost=held>0?costBasis/held:0;
  const maxBuy=Math.max(0,Math.floor(S.cash/st.price));
  openModal({
    title:(side==="buy"?"买入 ":"卖出 ")+st.emoji+st.name,
    body:`当前价 $${st.price.toFixed(2)} ｜ ${side==="buy"?"最多可买 "+maxBuy+" 股":"持有 "+held+" 股"}`,
    html:`<div class="card" style="margin-bottom:10px;padding:10px">
      <div class="row"><span class="muted">持仓均价</span><b>${held?money(avgCost):"—"}</b></div>
      <div class="row"><span class="muted">当前浮动盈亏</span><b class="${held*st.price-costBasis>=0?'pos':'neg'}">${held?money(held*st.price-costBasis):"—"}</b></div>
    </div>
    <input id="qty" type="number" min="1" value="${side==='buy'?Math.min(10,maxBuy||1):Math.min(10,held)}"
      style="width:100%;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:#fff;font-size:16px;text-align:center;margin-bottom:10px"/>
    <div style="display:flex;gap:6px">${[10,50,100].map(q=>`<button class="btn ghost sm" data-q="${q}" style="flex:1">${q}</button>`).join("")}<button class="btn ghost sm" data-q="max" style="flex:1">全部</button></div>`,
    choices:[
      {label:(side==="buy"?"确认买入":"确认卖出"),onClick:()=>{
        const q=parseInt($("#qty").value)||0;
        if(q<=0)return toast("请输入有效股数");
        if(side==="buy"){
          if(q>maxBuy)return toast("💸 现金不足");
          const cost=q*st.price;
          S.cash-=cost;
          S.portfolio[id]=held+q;
          S.stockCost[id]=(S.stockCost[id]||0)+cost;
          logEvent(`买入 ${st.name} ${q}股，成本 ${money(cost)}`);
          toast("✅ 买入 "+q+" 股，扣除 "+money(cost));
        }else{
          if(q>held)return toast("持股不足");
          const gain=q*st.price;
          const avg=costBasis/held;
          const soldCost=avg*q;
          const profit=gain-soldCost;
          S.cash+=gain;
          S.portfolio[id]=held-q;
          S.stockCost[id]=Math.max(0,costBasis-soldCost);
          if(S.portfolio[id]<=0){
            delete S.portfolio[id];
            delete S.stockCost[id];
          }
          if(profit>=100000)unlock("stock_win");
          logEvent(`卖出 ${st.name} ${q}股，回款 ${money(gain)}，${profit>=0?"盈利":"亏损"} ${money(Math.abs(profit))}`);
          toast(`✅ 卖出 ${q} 股，回款 ${money(gain)}<br><small class="${profit>=0?'pos':'neg'}">${profit>=0?"盈利 ":"亏损 "}${money(Math.abs(profit))}</small>`);
        }
        save();
        closeModal();
        renderStocks();
        refreshHUD();
      }},
      {label:"取消",onClick:closeModal}
    ]
  });
  setTimeout(()=>$$("[data-q]").forEach(b=>b.onclick=()=>{
    $("#qty").value=b.dataset.q==="max"?(side==="buy"?maxBuy:held):Math.min(parseInt(b.dataset.q),side==="buy"?maxBuy:held);
  }),30);
}

function stockPortfolioSummary(){
  let invested=0,value=0;
  for(const id in S.portfolio){
    const st=STOCKS.find(x=>x.id===id);
    if(!st)continue;
    invested+=S.stockCost[id]||0;
    value+=st.price*(S.portfolio[id]||0);
  }
  return {invested,value,profit:value-invested};
}

function ensureChat(id){if(!S.chats[id])S.chats[id]=[];return S.chats[id];}
function renderMsg(){
  const groups=[["tycoon","💼 商业大佬"],["star","🌟 明星名流"],["family","👪 家人"],["friend","🧑‍🤝‍🧑 朋友"]];

      CONTACTS.filter(c=>c.cat===cat).map(c=>{
        const chat=S.chats[c.id]||[];const last=chat[chat.length-1];
        const unread=chat.filter(m=>m.unread).length;
        return `<div class="list-item" data-chat="${c.id}"><div class="avatar">${c.emoji}</div>
          <div class="li-main"><div class="n">${c.name} <span class="muted" style="font-weight:400">${c.role}</span></div>

          ${unread?`<span class="badge" style="position:static">${unread}</span>`:""}</div>`;
      }).join("")).join("");
  $$("[data-chat]").forEach(el=>el.onclick=()=>openChat(el.dataset.chat));
}
function openChat(id){
  const c=cById(id);const chat=ensureChat(id);
  activeChatId=id;
  chat.forEach(m=>m.unread=false);save();updateBadges();
  const quicks=[...QUICK_REPLIES].sort(()=>Math.random()-.5).slice(0,3);
  openModal({title:c.emoji+" "+c.name,
    modalClass:"chat-modal",
    html:`<div class="chat-modal-body">
      <div class="chat-wrap" id="chatWrap" style="margin-bottom:6px">
        ${chat.length?chat.map(m=>`<div class="msg-bubble ${m.from==="me"?"msg-out":"msg-in"}">${esc(m.text)}</div>`).join(""):`<div class="center-empty">和 ${c.name} 打个招呼吧</div>`}
      </div>
      <div class="quick">${quicks.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <div class="inbar"><input id="chatIn" placeholder="输入消息..." maxlength="60"/><button class="btn sm" id="chatSend">发送</button></div>
    </div>`,
    choices:[{label:"关闭",onClick:closeModal}]});
  const send=(text)=>{
    text=(text||"").trim();if(!text)return;
    chat.push({from:"me",text,unread:false});save();
    reopenChatScroll(id);
    setTimeout(()=>{
      chat.push({from:"them",text:vars(pick(c.replies)),unread:false});save();
      if(activeChatId===id && $("#overlay").classList.contains("show"))reopenChatScroll(id);
    },randi(600,1200));
  };
  setTimeout(()=>{
    $$("#modal .quick button").forEach(b=>b.onclick=()=>send(b.dataset.q));
    const inp=$("#chatIn");
    $("#chatSend").onclick=()=>{send(inp.value);inp.value="";};
    inp.onkeydown=e=>{if(e.key==="Enter"){send(inp.value);inp.value="";}};
    scrollChat();
  },30);
}
function reopenChatScroll(id){
  if(activeChatId!==id)return;
  const c=cById(id);const chat=S.chats[id];
  const wrap=$("#chatWrap");if(!wrap)return;
  wrap.innerHTML=chat.map(m=>`<div class="msg-bubble ${m.from==="me"?"msg-out":"msg-in"}">${esc(m.text)}</div>`).join("");
  scrollChat();
}
function scrollChat(){const w=$("#chatWrap");if(w)w.scrollTop=w.scrollHeight;}

function busy(){return $("#call").classList.contains("show")||$("#overlay").classList.contains("show");}
function startOutgoing(id){
  const c=cById(id);callState={c,convo:[],incoming:false};
  const el=$("#call");el.className="show";
  el.innerHTML=`
    <div class="who">${c.name}</div><div class="role">${c.role}</div>

    <div class="big">${c.emoji}</div>
    <div class="actions"><button class="call-btn hang" id="hangup">📵</button></div>`;
  $("#hangup").onclick=endCall;
  setTimeout(()=>{if(callState&&callState.c.id===id){callState.convo.push({from:"them",text:vars(pick(c.open))});talking();}},1300);
}
function incomingCall(){
  const c=pick(CONTACTS);callState={c,convo:[],incoming:true};
  const el=$("#call");el.className="show ringing";
  el.innerHTML=`
    <div class="who">${c.name}</div><div class="role">${c.role} · 来电</div>
    <div class="status">📳 正在响铃…</div>
    <div class="big">${c.emoji}</div>
    <div class="actions">
      <button class="call-btn dec" id="decline">📵</button>
      <button class="call-btn acc" id="accept">📞</button></div>`;
  $("#decline").onclick=()=>{endCall();delta({mood:-1});toast("📵 你挂断了 "+c.name);};
  $("#accept").onclick=()=>{callState.convo.push({from:"them",text:vars(pick(c.open))});talking();};
}
function talking(){
  const {c}=callState;
  if(["star","tycoon"].includes(c.cat))unlock("call_star");
  const el=$("#call");el.className="show";
  const quicks=[...QUICK_REPLIES].sort(()=>Math.random()-.5).slice(0,3);
  el.innerHTML=`
    <div class="who">${c.name}</div><div class="role">${c.role}</div>
    <div class="status">📞 通话中…</div>
    <div class="big" style="width:70px;height:70px;font-size:36px;margin:10px auto">${c.emoji}</div>
    <div id="callLog"></div>
    <div id="callReply">
      <div class="quick">${quicks.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <div class="inbar"><input id="callIn" placeholder="说点什么..." maxlength="60"/><button class="btn sm" id="callSend">说</button></div>
    </div>
    <div class="actions"><button class="call-btn hang" id="hangup">📵</button></div>`;
  drawCallLog();
  const say=(text)=>{
    text=(text||"").trim();if(!text||!callState)return;
    callState.convo.push({from:"me",text});drawCallLog();
    const cc=callState.c;
    setTimeout(()=>{if(callState&&callState.c.id===cc.id){callState.convo.push({from:"them",text:vars(pick(cc.replies))});drawCallLog();}},randi(800,1400));
  };
  $$("#callReply .quick button").forEach(b=>b.onclick=()=>say(b.dataset.q));
  const inp=$("#callIn");
  $("#callSend").onclick=()=>{say(inp.value);inp.value="";};
  inp.onkeydown=e=>{if(e.key==="Enter"){say(inp.value);inp.value="";}};
  $("#hangup").onclick=endCall;
}
function drawCallLog(){
  const log=$("#callLog");if(!log||!callState)return;
  log.innerHTML=`<div class="chat-wrap">`+callState.convo.map(m=>`<div class="msg-bubble ${m.from==="me"?"msg-out":"msg-in"}">${esc(m.text)}</div>`).join("")+`</div>`;
  log.scrollTop=log.scrollHeight;
}
function endCall(){
  if(callState&&callState.convo.length){
    const chat=ensureChat(callState.c.id);
    callState.convo.forEach(m=>chat.push({from:m.from,text:m.text,unread:false}));
    save();
  }
  callState=null;$("#call").className="";$("#call").innerHTML="";updateBadges();
}

}

  $("#goEntertainment").onclick=()=>switchView("v-entertainment");
  $("#goSet").onclick=()=>switchView("v-settings");
  $("#resetBtn").onclick=()=>{if(confirm("确定清空存档、重开一局吗？")){localStorage.removeItem(SAVE_KEY);location.reload();}};
}
const LEADERBOARD=[
  {n:"贝所思",nw:2.1e12},{n:"马思克",nw:1.8e12},{n:"神秘老钱",nw:9e11},
  {n:"煤老板老赵",nw:4e11},{n:"盖饭",nw:1.2e11},{n:"王见林",nw:6e10},{n:"王思葱",nw:2e10}
];
function leaderboardRank(nw){
  const all=[...LEADERBOARD,{n:S.name+"（你）",nw,me:true}].sort((a,b)=>b.nw-a.nw);
  const idx=all.findIndex(x=>x.me);
  return all.map((x,i)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);${x.me?"color:var(--gold);font-weight:700":""}">
    <span>${i+1===1?"🥇":i+1===2?"🥈":i+1===3?"🥉":"#"+(i+1)} ${esc(x.n)}</span><span>${money(x.nw)}</span></div>`).join("")+
    `<div class="muted" style="margin-top:8px">你排名第 ${idx+1} 位，加油冲榜！</div>`;
}

function moveStocks(){
  STOCKS.forEach(st=>{st._last=st.price;let d=rand(-st.vol,st.vol);if(Math.random()<.03)d*=rand(2,5);st.price=Math.max(0.01,+(st.price*(1+d)).toFixed(2));});
  if($("#v-market").classList.contains("active")&&marketTab==="stocks")renderStocks();
}

function openModal({title,body,html,choices,modalClass=""}){
  const m=$("#modal");
  m.className="modal"+(modalClass?" "+modalClass:"");
  m.innerHTML=`<h3>${title||""}</h3>${body?`<p>${body}</p>`:""}${html||""}
    <div class="choices">${(choices||[]).map((c,i)=>`<button class="choice" data-i="${i}">${c.label}</button>`).join("")}</div>`;
  $("#overlay").classList.toggle("chat-open",modalClass==="chat-modal");
  $("#overlay").classList.add("show");
  $$(".choice",m).forEach((b,i)=>b.onclick=()=>choices[i].onClick&&choices[i].onClick());
}
function closeModal(){
  $("#overlay").classList.remove("show","chat-open");
  $("#modal").className="modal";
  activeChatId=null;
}

function scheduleCalls(){
  clearTimeout(callTimer);
  callTimer=setTimeout(()=>{if(!busy()&&!S.settings.doNotDisturb)incomingCall();scheduleCalls();},clamp((S.settings.callSec||10)*1000,1000,600000));
}
function scheduleSms(){
  clearTimeout(smsTimer);
  smsTimer=setTimeout(()=>{incomingSMS();scheduleSms();},clamp((S.settings.smsSec||5)*1000,1000,600000));
}

function startGame(name,gender,diff){
  S=newState(name,gender,diff);
  S.social=[
    {author:"马思克",avatar:"🚀",vip:true,text:"火星的房价还是太贵了，得再发几枚火箭。",img:"✈️",time:"刚刚",day:1,likes:2380000,comments:88000,reposts:41000,hot:true},
    {author:"王思葱",avatar:"🐶",vip:true,text:"给我家狗又添了俩表，它现在比我还有品味。",img:"🐶",time:"1小时前",day:1,likes:990000,comments:52000,reposts:12000,hot:false},
  ];
  save();enterGame();
  setTimeout(()=>toast("👋 欢迎你，"+S.name+" "+honor()+"！各路人马马上会联系你。",4000),500);
}
function enterGame(){
  $("#start").style.display="none";
  settleDays();refreshHUD();switchView("v-home");
  clearInterval(clockTimer);clearInterval(stockTimer);
  clockTimer=setInterval(()=>{
    refreshHUD();
    regenAcc++;
    if(regenAcc%30===0){S.energy=clamp(S.energy+1,0,100);}
    if(regenAcc%60===0){settleDays();}
  },1000);
  stockTimer=setInterval(moveStocks,5000);
  scheduleCalls();scheduleSms();scheduleRandomEvents();
}
function boot(){
  const saved=load();
  let gender="male",diff="normal";
  $$("#genderPick button").forEach(b=>b.onclick=()=>{$$("#genderPick button").forEach(x=>x.classList.remove("on"));b.classList.add("on");gender=b.dataset.g;});
  $$(".diff button").forEach(b=>b.onclick=()=>{$$(".diff button").forEach(x=>x.classList.remove("on"));b.classList.add("on");diff=b.dataset.d;});
  $("#startBtn").onclick=()=>startGame($("#nameInput").value.trim(),gender,diff);
  if(saved){
    $("#continueBtn").style.display="block";
    $("#continueBtn").onclick=()=>{
      normalizeLoadedState(saved);
      enterGame();
    };
  }
  $$("#nav button").forEach(b=>b.onclick=()=>switchView(b.dataset.nav));
  $("#overlay").onclick=e=>{if(e.target.id==="overlay")closeModal();};
  setInterval(()=>{$("#sbTime").textContent=fmtRealTime();},1000);
  $("#sbTime").textContent=fmtRealTime();
}
boot();
</script>
